name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ontology/tests/requirements.txt -r inferlib/python_ref/requirements.txt
      - run: pytest ontology/tests inferlib/python_ref
